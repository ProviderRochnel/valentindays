name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jetons nécessaires à la publication sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `enablement` crée le site Pages s'il n'existe pas encore. La création
      # n'est possible que sur un dépôt public, ou privé avec un plan payant :
      # sur un dépôt privé en plan Free, l'API répond « Resource not accessible
      # by integration » et il faut alors passer par Settings → Pages →
      # Source : GitHub Actions.
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        # `base_path` vaut « /valentindays » pour un site de projet et « » pour
        # un site d'organisation ; la barre finale est attendue par Vite.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Mettre en ligne
    needs: construire
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
